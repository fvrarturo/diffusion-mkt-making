# Conda env for the cluster. Recreate with:
#   module load miniforge && conda env create -f environment.yml
name: diffmm
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - pandas>=2.2
  - polars>=0.20
  - pyarrow>=15
  - scipy>=1.11
  - scikit-learn>=1.4
  - statsmodels>=0.14
  - matplotlib>=3.8
  - seaborn>=0.13
  - tqdm>=4.66
  - pytorch>=2.2
  - pytorch-cuda=12.1
  - pip:
      - pytorch-lightning>=2.2
      - diffusers>=0.27
      - einops>=0.7
      - hydra-core>=1.3
      - omegaconf>=2.3
      - wandb>=0.16
      - -e .
