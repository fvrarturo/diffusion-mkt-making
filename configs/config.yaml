# Root Hydra config. Each entry-point script composes from subgroups below.
defaults:
  - data: intc_top
  - generator: finetune
  - cluster: local
  - _self_

experiment_name: default
seed: 42

# Where this run's outputs land. Hydra fills in the timestamp.
output_dir: results/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}

# Keep the working directory at the project root — relative paths in configs
# (e.g., data/raw/...) refer to the project root, not Hydra's per-run dir.
hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}

# W&B
wandb:
  enabled: false       # flip to true on the cluster
  project: diffmm
  entity: null
  mode: online         # online / offline / disabled
