# Conditional DDPM fine-tuning.
model:
  embed_dim: 128
  hidden_dim: 256                  # for MinimalDenoiser; ignored when TRADES is loaded
  n_categories_per_axis: [3, 3, 3, 3]
  use_pretrained_trades: false     # flip to true once trades_adapter is implemented
  pretrained_checkpoint: null
  # Phase C (v5+): "adaln_zero" — DiT-style per-block adaptive layer norm with
  # zero-init residual gates. ~13× more conditioning capacity per layer than
  # FiLM and starts as exact identity. Targets the FiLM-collapse failure mode
  # (Work6_v4 §4: γ_in std/mean stuck at 2.88% across all FiLM-conditioning
  # variants v2-v4 vs target 5%).
  # Pre-Phase C (v2-v4): "film" — TRADES-style FiLM at start/end. Default for
  # backwards compat with prior checkpoints.
  # Phase E (v8): use "film" — v2's FiLM uniquely preserved OFI→return
  # correlation; the marginals-vs-joints finding (Work6_FINAL §9) suggests
  # AdaLN's extra capacity helps marginals but hurts joints. With copula
  # transform handling marginals, FiLM's joint-preserving conditioning is
  # the right architecture.
  conditioning_type: "film"

schedule:
  type: cosine                     # cosine | linear
  T: 1000
  # Phase B (v4+): "v"   — predict v = √ᾱ_t·ε − √(1−ᾱ_t)·x_0 (Salimans & Ho 2022).
  # Pre-Phase B (v2/v3/v3.5): "eps" — predict noise (Ho et al. 2020 standard).
  # The choice must match what the checkpoint was trained with — passing the
  # wrong prediction_type to a checkpoint produces garbage at sample time.
  # Sampling scripts read this from the config or accept a `--prediction-type`
  # CLI override.
  # NOTE: when generator.edm.enabled is true (Phase D / v6+), this field is
  # ignored — EDM uses its own σ-spaced schedule and x_0-prediction with
  # preconditioning instead.
  # Phase E (v8): use "eps" — copula-Gaussianized data has ~N(0,1) marginals
  # by construction, so v-prediction's signal-correlated target at low t
  # offers no benefit (no extreme values to commit to). ε-prediction's
  # mode-covering behavior is exactly what we want for joint-structure
  # preservation. See Work6_FINAL §9.
  prediction_type: "eps"

# Phase D (v6+) — EDM training & sampling (Karras et al. 2022). When
# enabled=true, the trainer uses EDMTrainer + the σ-weighted loss and the
# generator wraps the inner TRADES-style denoiser with EDMDenoiser
# preconditioning. The DDPM schedule above is ignored. Sampling must use
# `--use-edm` to invoke the Heun 2nd-order sampler. Default: disabled
# (v2-v5 DDPM/v-pred behavior preserved).
#
# NOTE: Phase E (v8) — when copula.enabled is true, EDM should typically
# be disabled. Copula-Gaussianized data has marginals ~N(0,1) by
# construction, so EDM's σ-dependent preconditioning offers no benefit
# over plain ε-prediction (which is also more joint-structure-preserving).
edm:
  enabled: false
  sigma_min: 0.002
  sigma_max: 80.0
  sigma_data: 1.5                  # ≈ std of normalized training data; tune if it underperforms
  rho: 7.0
  P_mean: -1.2                     # log-normal σ sampling: log σ ~ N(P_mean, P_std)
  P_std: 1.2

# Phase E (v8) — Copula-based diffusion (per-feature empirical-CDF
# Gaussianization). The diffusion model trains on Gaussianized data;
# heavy tails and original-scale marginals are restored mechanically at
# sampling time via the inverse empirical CDF. Targets the marginals-vs-
# joints tension documented in Work6_FINAL §9: ε-prediction on Gaussian
# targets preserves cross-feature covariance (joints), while the inverse
# CDF restores any marginal shape (heavy tails, asymmetric skew, etc.).
#
# When `enabled: true`:
#   - Dataset uses CopulaTransform.normalize() instead of NormStats
#   - Sampling pipeline applies CopulaTransform.denormalize() before decode
#   - Recommend: prediction_type="eps", edm.enabled=false, conditioning_type="film"
#     (architecturally closest to v2 which uniquely preserved OFI→return)
copula:
  enabled: true
  clip_quantile: 0.001             # winsorize tails to ε / 1-ε to avoid Φ⁻¹(0) = -∞
  max_samples_per_feature: 5000000 # cap CDF storage (~40 MB per feature at 5M float64)
  # If null, auto-detect discrete features (≤32 unique values).
  # Otherwise, list column indices into FEATURE_COLUMNS.
  discrete_features: null
  # Phase E v9 (2026-05-07) — dequantize point masses before fitting the CDF.
  # INTC mid_return is 89% exact zeros (quote_update events with no mid change);
  # trade_sz is 95% zeros (no-trade events). Without dequantization the empirical
  # CDF is discontinuous at these point masses, the probit Φ⁻¹ collapses each
  # point mass to a single z-value, and the diffusion model learns a
  # near-constant z (kurtosis 2.6 instead of predicted 400-1000 — see deep
  # diagnostic 2026-05-07). Dequantization spreads each point mass uniformly
  # over [v-ε, v+ε]; at sample time values near v_pm are snapped back.
  # Reference: Theis et al. 2016, "A note on the evaluation of generative models".
  dequantize: true
  point_mass_threshold: 0.05       # frequency cutoff for "this is a point mass"

# Phase F Model A — Cascade conditional generation.
# When `noise_mask`/`loss_mask` are set, the trainer treats them as per-feature
# binary masks: channels with mask=0 are NOT noised (passed through clean as
# conditioning) and contribute 0 to the loss. Used to train Stage 2 of a
# cascade: keep book features (bid/ask, sizes, trade) clean, only diffuse the
# conditional channel of interest (typically mid_return = index 7).
# Defaults: both null → all-ones (v2 behavior, every channel diffused).
# FEATURE_COLUMNS index map:
#   0=bid_dist  1=ask_dist  2=bid_sz  3=ask_sz
#   4=trade_dist  5=trade_sz  6=trade_sign  7=mid_return
# Stage 2 of the v10 cascade uses [0,0,0,0,0,0,0,1] for both masks.
cascade:
  noise_mask: null
  loss_mask: null

training:
  learning_rate: 1.0e-4
  weight_decay: 0.0
  # CFG dropout 0.20 — used as the *steady-state* value when the curriculum
  # below ramps to its final state. Work5 §F.2 showed that at p=0.10 the
  # conditional path was active 90% of training and the model was satisfying
  # the unconditional-path constraint by collapsing FiLM modulation to be
  # near-identical regardless of c. 0.20 forces the unconditional path more
  # often → conditional path can no longer ignore c.
  cfg_dropout: 0.2

  # Phase B conditioning curriculum: epochs 0..ramp_start are fully
  # unconditional (cfg_dropout=1.0); then dropout linearly ramps to the
  # `final` value over [ramp_start, ramp_end]. Forces the unconditional
  # pathway to converge to a solid baseline before FiLM is asked to
  # specialize across regimes. Disable by setting `enabled: false`, in
  # which case the trainer uses the constant `cfg_dropout` value above.
  cfg_dropout_curriculum:
    enabled: true
    initial: 1.0
    final: 0.2                     # match cfg_dropout above
    ramp_start_epoch: 2            # epochs 0,1 fully unconditional
    ramp_end_epoch: 5              # epoch 5+ at steady-state CFG dropout
  freeze_backbone: false           # true → only conditioning head trains
  # Min-SNR loss weighting (Hang et al. 2023). γ=5.0 (back to v2 default after
  # Phase A's γ=1.0 caused a kurtosis regression, 122 → 81). Min-SNR weight is
  # `min(SNR, γ) / SNR`: at low-noise timesteps (SNR > γ) the weight is γ/SNR,
  # which down-weights that band. Heavy-tail information lives in the
  # low-noise band (fine-detail denoising), so smaller γ down-weights tail
  # recovery — the OPPOSITE of what was intended. γ=5 keeps the down-weighting
  # gentle enough that fine-detail learning isn't starved. Set to null to
  # disable Min-SNR entirely (plain MSE).
  min_snr_gamma: 5.0
  batch_size: 64
  max_epochs: 20
  max_steps: null                  # override to cap training steps (useful for smoke)
  limit_train_batches: null        # Lightning trainer arg; null = full epoch
  limit_val_batches: null
  gradient_clip_val: 1.0
  precision: "bf16-mixed"          # cluster GPUs (H100/H200/L40S) all support bf16
  # Patience 6 (was 3 for v2). v2 early-stopped at epoch 4 of 20, before FiLM
  # had time to specialize across regimes. With FiLM now random-init'd
  # (conditioning.py docstring) and CFG dropout doubled, conditioning needs
  # more epochs to converge — bumping patience prevents premature stopping.
  early_stopping_patience: 6
  num_workers: 4

  # Phase F Model B — auxiliary losses computed on the single-step x̂_0
  # approximation. Each component is curriculum-ramped (lambda 0 before
  # ramp_start_epoch, ramp linearly to lambda_final at ramp_end_epoch).
  # Defaults: all disabled → no aux losses (v2 behavior).
  # All operate on x̂_0 = (x_t - √(1-ᾱ)·ε_pred)/√ᾱ via stop-gradient
  # through schedule constants. Stable at v2's hyperparameter scale.
  aux_losses:
    # 1. Joint OFI→return slope preservation. OFI proxy = bid_sz - ask_sz
    # at x̂_0 scale. Per-window OLS slope of return on OFI; MSE against
    # `target_slope` (precomputed on real INTC: ~1.11e-4 at Δ=50).
    joint:
      enabled: false
      lambda_final: 0.1
      ramp_start_epoch: 2
      ramp_end_epoch: 5
      bid_sz_idx: 2
      ask_sz_idx: 3
      return_idx: 7
      target_slope: 1.11e-4
    # 2. Kurtosis hinge. One-sided penalty on (target_kurt - kurt(x̂_0_return)),
    # squared and normalized by target_kurt². No penalty if kurt overshoots
    # (v5 showed overshoot is reachable; under-shoot is the v2 problem).
    kurt:
      enabled: false
      lambda_final: 0.01
      ramp_start_epoch: 3
      ramp_end_epoch: 6
      return_idx: 7
      target_kurt: 500.0
    # 3. Tail-importance weighting. Per-window weight w = 1 + α·(extremity/σ_data)^p
    # where extremity = max|return| over the window. Adds the *delta* over the
    # baseline ε-MSE to encourage learning rare large-magnitude windows.
    tail:
      enabled: false
      lambda_final: 1.0
      ramp_start_epoch: 0
      ramp_end_epoch: 3
      alpha: 0.5
      p: 2.0
      sigma_data: 1.0
      return_idx: 7

checkpointing:
  dir: checkpoints
  save_top_k: 3
  monitor: "val/loss"
  mode: min
  every_n_epochs: 5
